# Vérifications automatiques à chaque envoi de code sur main et à chaque demande de fusion.
# Aucun secret n'est utilisé : les tests ne contactent aucun service (l'app n'a pas de réseau).
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, lint et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installation
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Vérification des types
        run: npm run typecheck
      - name: Lint
        run: npx expo lint --no-cache
      - name: Tests unitaires
        run: npx jest --ci

  e2e:
    name: Parcours dans le navigateur et accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installation
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Navigateur de test (version de Playwright du projet)
        run: npx playwright install --with-deps chromium
      - name: Export web et parcours e2e
        run: npm run e2e
